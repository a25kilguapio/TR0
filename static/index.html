<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endevina la marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 720px;">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div id="benvinguda" class="alert alert-success text-center mb-0 hidden"></div>
                <div id="formNom" class="input-group hidden">
                    <input type="text" id="inputNom" class="form-control" placeholder="Com et dius?" autocomplete="off">
                    <button id="btnGuardar" class="btn btn-primary" type="button">Guardar</button>
                </div>
                <div id="comptador" class="text-center text-muted small mt-2">Temps: 0 / 60 s</div>
                <div class="text-center mt-2">
                    <button id="btnEsborrar" class="btn btn-outline-danger btn-sm hidden" type="button">Esborrar el meu nom</button>
                </div>
            </div>
        </div>
        <div class="text-end mb-2">
            <a href="admin.html" class="d-inline-flex align-items-center gap-2 text-decoration-none bg-danger text-white rounded-pill ps-1 pe-3 py-1">
                <img src="images/admin.jpeg" alt="Admin" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                <span class="fw-bold">ADMIN</span>
            </a>
        </div>
        <h1 class="text-center mb-4">Endevina la marca</h1>
        <div id="marcador" class="mb-4"></div>
        <div class="d-flex align-items-center gap-2">
            <button id="btnAnterior" class="btn btn-outline-secondary" type="button">&laquo;</button>
            <div id="partida" class="flex-grow-1"></div>
            <button id="btnSeguent" class="btn btn-outline-secondary" type="button">&raquo;</button>
        </div>
        <div class="text-center my-4">
            <button id="sendAnswers" class="btn btn-success btn-lg hidden">Enviar respostes</button>
        </div>
    </div>
    <script src="functions.js"></script>
</body>
</html>
